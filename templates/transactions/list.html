{% extends 'base.html' %}{% block content %}<main class='wrap page'><span class='eyebrow'>Historique</span><h1>Mes transactions</h1><section class='card panel'>{% for t in items %}<div class='row'><span><b>{{ t.request.listing.title }}</b><small>{{ t.reference }} · {{ t.appointment_date }} {{ t.appointment_time }}</small></span><span class='badge'>{{ t.get_status_display }}</span></div>{% empty %}<p>Aucune transaction planifiée.</p>{% endfor %}</section></main>{% endblock %}
